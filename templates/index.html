{% extends "base.html" %}
{% block content %}
<p><a href="{{ url_for('nuevo') }}">+ Nuevo producto</a></p>
<table>
  <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
  {% for p in productos %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.nombre }}</td><td>{{ p.categoria }}</td>
    <td>{{ p.precio }}</td><td>{{ p.stock }}</td>
    <td>
  <a href="{{ url_for('editar', id=p.id) }}">Editar</a>
  <form method="post" action="{{ url_for('eliminar', id=p.id) }}" style="display:inline"
        onsubmit="return confirm('¿Eliminar este producto?')">
    <button type="submit">Eliminar</button>
  </form>
</td>
  </tr>
  {% else %}
  <tr><td colspan="6">No hay productos.</td></tr>
  {% endfor %}
</table>
{% endblock %}
